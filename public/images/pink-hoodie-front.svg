<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="pinkBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c48e8e"/>
      <stop offset="50%" style="stop-color:#d4a5a5"/>
      <stop offset="100%" style="stop-color:#c48e8e"/>
    </linearGradient>
    <linearGradient id="pinkSleeve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b87d7d"/>
      <stop offset="50%" style="stop-color:#d4a5a5"/>
      <stop offset="100%" style="stop-color:#b87d7d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="640" rx="160" ry="25" fill="#000000" opacity="0.12"/>
  
  <!-- Hood back -->
  <path d="M210 130 Q300 60 390 130 L390 200 Q300 180 210 200 Z" fill="#b87d7d"/>
  
  <!-- Left sleeve -->
  <path d="M180 210 Q140 220 110 300 L90 450 Q120 470 150 430 L190 320 Z" fill="url(#pinkSleeve)"/>
  
  <!-- Right sleeve -->
  <path d="M420 210 Q460 220 490 300 L510 450 Q480 470 450 430 L410 320 Z" fill="url(#pinkSleeve)"/>
  
  <!-- Main body -->
  <path d="M200 200 Q300 190 400 200 L410 580 Q300 600 190 580 Z" fill="url(#pinkBody)" filter="url(#softShadow)"/>
  
  <!-- Hood opening -->
  <path d="M240 180 Q300 240 360 180 Q300 140 240 180" fill="#e8c4c4"/>
  
  <!-- Hood front rim -->
  <path d="M220 160 Q300 220 380 160 L390 200 Q300 180 210 200 Z" fill="#d4a5a5"/>
  
  <!-- Drawstrings -->
  <path d="M270 210 Q270 280 265 330" stroke="#fff8f8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M330 210 Q330 280 335 330" stroke="#fff8f8" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Kangaroo pocket -->
  <path d="M245 420 Q300 440 355 420 L365 520 Q300 545 235 520 Z" fill="#c48e8e"/>
  
  <!-- Ribbing bottom -->
  <path d="M190 580 Q300 600 410 580 L410 610 Q300 630 190 610 Z" fill="#b87d7d"/>
  
  <!-- Cuffs -->
  <path d="M90 450 Q120 470 150 430 L155 460 Q125 490 95 470 Z" fill="#b87d7d"/>
  <path d="M510 450 Q480 470 450 430 L445 460 Q475 490 505 470 Z" fill="#b87d7d"/>
  
  <!-- Soft highlight -->
  <path d="M230 250 Q250 400 240 520" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.15" stroke-linecap="round"/>
</svg>